name: Refresh Broadway grosses

on:
  push:
    paths:
      - ".github/workflows/refresh-broadway.yml"
      - "scripts/refresh_broadway.py"
      - "scripts/publish_pages.py"
      - "tests/**"
  schedule:
    # Tuesday after the usual publication, Thursday retry for delayed releases.
    - cron: "0 23 * * 2,4"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: broadway-site-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test updater and frontend freshness
        run: |
          python -m unittest discover -s tests -p "test_*.py"
          node --test
      - name: Acquire and validate public weekly data
        run: python scripts/refresh_broadway.py
      - name: Commit changed datasets
        id: commit
        run: |
          git add broadway-weekly-data.json history-dashboard-data.json theatres-dashboard-data.json broadway-overview-data.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh Broadway weekly grosses" -m "Co-authored-by: Copilot App <223556219+Copilot@users.noreply.github.com>"
          git pull --rebase origin ${{ github.event.repository.default_branch }}
          git push origin HEAD:${{ github.event.repository.default_branch }}
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # Always retry publishing, even when a previous run committed data but its build failed.
      # GITHUB_TOKEN commits do not automatically trigger legacy Pages builds.
      - name: Rebuild and verify branch-based GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python scripts/publish_pages.py --repo "$REPOSITORY" --branch "$DEFAULT_BRANCH" --commit "$(git rev-parse HEAD)"
